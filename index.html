<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chalky Toe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.google.com/css2?family=Bungee&family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&display=swap"  rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="chalkdust"></div>
    <section class="screen active" id="screen-landing">
        <div class="eraser-decor"></div>
        <h1 class="chalk-title">Tic<span>Tac</span>Toe</h1>
        <p class="chalk-tagline"grab a piece of chalk, pick your side, and try not to let them get three in a row!></p>
        <div class=""menu-buttons>
            <button class="chalk-btn" id="btnSingle">
                Single Player
                <span class="btn-sub">you against the machine</span>
            </button>
            <button class="chalk-btn" id="btnMulti">
                Multiplayer
                <span class="btn-sub">two players, one board</span>
        </div>
    </section>
    <section class="screen" id="screen-difficulty">
        <h2 class="section-heading">Pick Your Fight</h2>
        <div class="diff-buttons">
            <button class="chalk-btn diff-btn" data-diff="easy">Easy
                <span class="btn-sub">Still learning to hold the chalk</span>
            </button>
            <button class="chalk-btn diff-btn" data-diff="medium">Medium
                <span class="btn-sub">knows a trick or two</span>
            </button>
            <button class="chalk-btn diff-btn" data-diff="hard">Hard
                <span class="btn-sub">basically GOD, good luck</span>
            </button>
        </div>
        <button class="black-link" data-back="screen-landing">&larr; back to menu</button>
    </section>
    <section class="screen" id="screen-symbol">
        <h2 class="section-heading">be X or be O</h2>
        <div class="symbol-buttons">
            <button class="chalk-btn symbol-btn" data-symbol="X">X</button>
            <button class="chalk-btn symbol-btn" data-symbol="O">O</button>
        </div>
        <button class="black-link" data-back="screen-difficulty">&larr; back</button>
    </section>
    <section class="screen" id="screen-game">
        <div class="game-header">
            <button class="icon-btn" id="menuBtn" title="back to menu" aria-label="back to menu">&larr;</button>
            <div class="scoreboard">
                <div class="score-card score-x">
                    <span class="score-label" id="labelX">X</span>
                    <span class="score-num" id="scoreX">0</span>
                </div>
                <div class="score-card score-draw">
                    <span class="score-label">Draws</span>
                    <span class="score-num" id="scoreDraw">0</span>
            </div>
                <div class="score-card score-o">
                    <span class="score-label" id="labelO">O</span>
                    <span class="score-num" id="scoreO">0</span>
                </div>
        </div>
        <button class="icon-btn" id="resetScoreBtn" title="reset scores" aria-label="reset scores">&#8635;</button>
    </div>
    <p class="turn-indicator" id="turnIndicator">X's turn</p>
    <div class="board-frame" id="boardFrame">
        <div class="board" id="board">
            </div>
        </div>
        <button class="chalk-btn-new-round-btn" id="newRoundBtn">New Round</button>
    </section>
    <canvas id="confettiCanvas"></canvas>
    <div class="result-banner" id="resultBanner"><span id="resultText"></span></div>
        <script src="script.js"></script>
</body>
</html>
